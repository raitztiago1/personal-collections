services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalogo}
      POSTGRES_DB: ${POSTGRES_DB:-catalogo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
